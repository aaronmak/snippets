[project]
name = "activity-report"
version = "0.1.0"
description = "Multi-platform activity report generator for Jira and GitHub"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
]

[project.scripts]
activity-report = "cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clients*", "generators*", "templates*"]

[tool.setuptools.package-data]
templates = ["*.html"]
